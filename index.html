<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 퀴즈쇼 - 학생용</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 font-sans select-none">
  <div class="w-full max-w-sm">

    <!-- 1. 입장 폼 -->
    <div id="view-join" class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl">
      <div class="text-center mb-6">
        <span class="text-xs bg-emerald-950 border border-emerald-800 text-emerald-300 px-3 py-1 rounded-full font-bold">학생 전용</span>
        <h1 class="text-2xl font-black mt-2 text-slate-100">역사 퀴즈쇼 참가</h1>
      </div>
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">칠판의 PIN 코드 (6자리)</label>
          <input id="input-pin" type="text" placeholder="예: 492102" class="w-full p-3.5 bg-slate-950 border border-slate-700 rounded-xl text-center text-xl font-mono tracking-widest focus:border-emerald-500 focus:outline-none uppercase">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">내 이름 또는 번호</label>
          <input id="input-name" type="text" placeholder="예: 1번 김역사" class="w-full p-3.5 bg-slate-950 border border-slate-700 rounded-xl text-center text-lg focus:border-emerald-500 focus:outline-none">
        </div>
      </div>
      <button onclick="joinGame()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-lg transition shadow-lg shadow-emerald-600/30">입장하기</button>
    </div>

    <!-- 2. 대기 화면 -->
    <div id="view-waiting" class="hidden bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
      <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <h2 class="text-xl font-bold text-slate-200 mb-1">선생님 신호 대기 중</h2>
      <p class="text-slate-500 text-xs">문제가 시작되면 칠판 화면에 집중해 주세요!</p>
    </div>

    <!-- 3. 1단계: 문제 지문 읽기 화면 -->
    <div id="view-read" class="hidden bg-slate-900 border border-indigo-900/60 p-6 rounded-3xl text-center shadow-xl">
      <div class="flex justify-between items-center mb-3">
        <span id="read-badge-q" class="text-xs bg-indigo-950 border border-indigo-800 text-indigo-300 px-3 py-1 rounded-full font-bold">Q 1 읽는 중</span>
        <span id="read-badge-pts" class="text-xs bg-amber-950 border border-amber-800 text-amber-400 px-2.5 py-1 rounded-full font-bold">+150점</span>
      </div>
      <div class="py-6">
        <p class="text-4xl mb-3">📖</p>
        <h3 class="text-lg font-bold text-slate-200 mb-2">칠판의 문제를 먼저 읽으세요!</h3>
        <p class="text-slate-400 text-xs leading-relaxed">선생님이 정답 입력을 시작하면<br>선택 버튼이 즉시 나타납니다.</p>
      </div>
    </div>

    <!-- 4. 2단계: 정답 선택 버튼 패드 -->
    <div id="view-pad" class="hidden bg-slate-900 border border-slate-800 p-5 rounded-3xl">
      <div class="flex justify-between items-center mb-4">
        <span id="badge-q" class="text-xs bg-slate-800 border border-slate-700 text-indigo-300 px-3 py-1 rounded-full font-bold">정답 선택 중</span>
        <span id="badge-pts" class="text-xs bg-amber-950 border border-amber-800 text-amber-400 px-2.5 py-1 rounded-full font-bold">+150점</span>
      </div>

      <!-- 4지선다 패드 -->
      <div id="pad-choice" class="grid grid-cols-2 gap-3">
        <button onclick="submit(0)" class="h-28 bg-rose-700 active:scale-95 text-3xl font-black rounded-2xl transition shadow-lg">①</button>
        <button onclick="submit(1)" class="h-28 bg-blue-700 active:scale-95 text-3xl font-black rounded-2xl transition shadow-lg">②</button>
        <button onclick="submit(2)" class="h-28 bg-amber-700 active:scale-95 text-3xl font-black rounded-2xl transition shadow-lg">③</button>
        <button onclick="submit(3)" class="h-28 bg-emerald-700 active:scale-95 text-3xl font-black rounded-2xl transition shadow-lg">④</button>
      </div>

      <!-- OX 패드 -->
      <div id="pad-ox" class="hidden grid grid-cols-2 gap-3">
        <button onclick="submit(0)" class="h-32 bg-blue-700 active:scale-95 text-4xl font-black rounded-2xl transition shadow-lg">O</button>
        <button onclick="submit(1)" class="h-32 bg-rose-700 active:scale-95 text-4xl font-black rounded-2xl transition shadow-lg">X</button>
      </div>

      <!-- 단답형 패드 -->
      <div id="pad-short" class="hidden space-y-3">
        <input id="input-text" type="text" placeholder="정답 단어 입력 (20초)" class="w-full p-4 bg-slate-950 border border-slate-700 rounded-xl text-center text-lg focus:border-emerald-500 focus:outline-none">
        <button onclick="submitText()" class="w-full py-3.5 bg-emerald-600 active:scale-95 font-bold rounded-xl text-lg transition">답안 제출</button>
      </div>
    </div>

    <!-- 5. 결과 화면 -->
    <div id="view-result" class="hidden bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
      <h2 id="res-title" class="text-2xl font-black mb-2">답안 접수 완료!</h2>
      <p id="res-desc" class="text-slate-400 text-xs mb-4">선생님이 결과를 공개할 때까지 대기하세요.</p>
      <div class="text-indigo-400 font-bold text-sm">현재 내 누적 점수: <span id="my-score" class="text-emerald-400 text-2xl font-black">0</span>점</div>
    </div>

  </div>

  <script>
    let peer = null;
    let conn = null;
    let savedPin = '';
    let savedName = '';

    function showOnlyView(viewId) {
      const views = ['view-join', 'view-waiting', 'view-read', 'view-pad', 'view-result'];
      views.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          if (id === viewId) el.classList.remove('hidden');
          else el.classList.add('hidden');
        }
      });
    }

    function joinGame() {
      savedPin = document.getElementById('input-pin').value.trim();
      savedName = document.getElementById('input-name').value.trim();
      if (!savedPin || !savedName) return alert('PIN 번호와 이름을 모두 입력해 주세요.');

      peer = new Peer({
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', () => {
        conn = peer.connect(`history-quiz-${savedPin}`, { reliable: true });
        conn.on('open', () => {
          conn.send({ type: 'JOIN', name: savedName });
          showOnlyView('view-waiting');
        });

        conn.on('data', (d) => {
          if (d.type === 'READ_PHASE') {
            showOnlyView('view-read');
            document.getElementById('read-badge-q').innerText = `Q ${d.qIndex + 1} 읽는 중`;
            document.getElementById('read-badge-pts').innerText = `+${d.points}점`;
          } else if (d.type === 'INPUT_PHASE' || d.type === 'QUESTION') {
            showOnlyView('view-pad');
            document.getElementById('badge-q').innerText = `Q ${d.qIndex + 1} 정답 선택 중`;
            document.getElementById('badge-pts').innerText = `+${d.points || 150}점`;

            document.getElementById('pad-choice').classList.add('hidden');
            document.getElementById('pad-ox').classList.add('hidden');
            document.getElementById('pad-short').classList.add('hidden');

            if (d.qType === 'choice') {
              document.getElementById('pad-choice').classList.remove('hidden');
            } else if (d.qType === 'ox') {
              document.getElementById('pad-ox').classList.remove('hidden');
            } else {
              document.getElementById('input-text').value = '';
              document.getElementById('pad-short').classList.remove('hidden');
            }
          } else if (d.type === 'RESULT') {
            showOnlyView('view-result');
            document.getElementById('res-title').innerText = d.isCorrect ? `🎉 정답! (+${d.earned}점)` : '💧 아쉽게 틀렸습니다';
            document.getElementById('res-title').className = d.isCorrect ? 'text-2xl font-black mb-2 text-emerald-400' : 'text-2xl font-black mb-2 text-rose-400';
            document.getElementById('my-score').innerText = d.score;
          }
        });

        conn.on('error', () => alert('선생님 방에 접속할 수 없습니다. PIN 번호를 확인해 주세요.'));
      });
    }

    function submit(val) {
      if (conn && conn.open) {
        conn.send({ type: 'SUBMIT', ans: val });
        showOnlyView('view-result');
        document.getElementById('res-title').innerText = '답안 접수 완료!';
        document.getElementById('res-title').className = 'text-2xl font-black mb-2 text-indigo-400';
      }
    }

    function submitText() {
      const txt = document.getElementById('input-text').value.trim();
      if (!txt) return;
      submit(txt);
    }
  </script>
</body>
</html>
